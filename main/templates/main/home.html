<!DOCTYPE html>
<html>
<head>
    <title>STUDENT RECORDS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #3b145c;
            font-size: 28px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #3b145c;
            color: white;
            padding: 10px;
            text-align: center;
        }

        td {
            background-color: #e8e1eb;
            padding: 8px;
            text-align: center;
            border: 1.5px solid rgb(17, 17, 17);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>STUDENT RECORDS</h1>

    <table>
        <tr>
            <th>STUDENT ID</th>
            <th>NAME</th>
            <th>AGE</th>
            <th>COURSE</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.student_id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.course }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="4">No students found.</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
